name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workflow lint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Node tests
        run: |
          if [ -z "$(find . -path ./node_modules -prune -o \( -name '*.test.mjs' -o -name '*.test.js' \) -print -quit)" ]; then
            echo "No Node test files yet."
            exit 0
          fi
          node --test
      - name: Python tests
        run: |
          found=0
          status=0
          while IFS= read -r -d '' d; do
            found=1
            python3 -m unittest discover -s "$d" -v || status=1
          done < <(find tools -name 'test*.py' -printf '%h\0' 2>/dev/null | sort -zu)
          if [ "$found" = 0 ]; then
            echo "No Python test files yet."
          fi
          exit $status
