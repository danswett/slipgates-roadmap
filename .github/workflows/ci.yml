name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests
        run: |
          if [ -z "$(find . -path ./node_modules -prune -o \( -name '*.test.mjs' -o -name '*.test.js' \) -print -quit)" ]; then
            echo "No Node test files yet."
            exit 0
          fi
          node --test
      - name: Python tests
        run: |
          dirs=$(find tools -name 'test*.py' -printf '%h\n' 2>/dev/null | sort -u)
          if [ -z "$dirs" ]; then
            echo "No Python test files yet."
            exit 0
          fi
          status=0
          for d in $dirs; do
            python3 -m unittest discover -s "$d" -v || status=1
          done
          exit $status
