name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The last good roadmap-data (this workflow's newest successful run on main) supplies --previous, so a failed read of the
      # commits, CI or merge counts shows its last good value labelled Stale instead of Data unavailable. Best effort: with no
      # artifact (first run, expired after 1 day, a failed data job) the dashboard runs without it, as before. The file is only
      # data: the dashboard checks it (plain finite JSON, bounded depth and size) and ignores what it cannot use.
      - name: Fetch the last good roadmap data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ]; then gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name roadmap-data --dir previous; fi
      - name: Read public epics and statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f previous/roadmap.json ]; then set -- --previous previous/roadmap.json; else set --; fi
          python tools/epic-dashboard/repo_dashboard.py --json-output roadmap.json --body-output "$RUNNER_TEMP/dashboard.md" "$@"
          python -c "import json; from pathlib import Path; from datetime import datetime, timezone; p = Path('roadmap.json'); d = json.loads(p.read_text()); d['updatedAt'] = datetime.now(timezone.utc).isoformat(); p.write_text(json.dumps(d))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roadmap-data
          path: roadmap.json
          retention-days: 1
  build:
    needs: data
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fetch public source without credentials
        run: |
          git init
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          name: roadmap-data
          path: data
      - name: Fetch public fleet counts
        continue-on-error: true
        run: |
          mkdir -p data
          curl --fail --silent --show-error --max-time 15 --max-filesize 4096 --output data/fleet-counts.tmp https://raw.githubusercontent.com/danswett/slipgates-roadmap/fleet-counts/fleet-counts.json
          mv data/fleet-counts.tmp data/fleet-counts.json
      - name: Fetch public people counts
        continue-on-error: true
        run: |
          mkdir -p data
          curl --fail --silent --show-error --max-time 15 --max-filesize 4096 --output data/people-at-work.tmp https://raw.githubusercontent.com/danswett/slipgates-roadmap/fleet-counts/people-at-work.json
          mv data/people-at-work.tmp data/people-at-work.json
      - name: Fetch public cost
        continue-on-error: true
        run: |
          mkdir -p data
          curl --fail --silent --show-error --max-time 15 --max-filesize 16384 --output data/cost.tmp https://raw.githubusercontent.com/danswett/slipgates-roadmap/fleet-counts/cost.json
          mv data/cost.tmp data/cost.json
      - run: node site/build.mjs data/roadmap.json _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  keepalive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/enable"
